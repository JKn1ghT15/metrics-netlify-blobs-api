<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel de Telemetría - Reduce, Recicla, Raccoon (RRR)</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f3f6f4;
      color: #1f2937;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
      margin: 0;
    }
    .card {
      background: #ffffff;
      max-width: 720px;
      width: 100%;
      border-radius: 14px;
      padding: 32px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
    }
    h1 {
      margin-top: 0;
      font-size: 1.6rem;
      color: #14532d;
    }
    p.subtitulo {
      color: #4b5563;
      margin-bottom: 24px;
    }
    .botones {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    button {
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      color: white;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    .btn-verde { background-color: #16a34a; }
    .btn-azul { background-color: #2563eb; }
    .resumen-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .stat-box {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 10px;
      padding: 14px;
      text-align: center;
    }
    .stat-box span {
      display: block;
      font-size: 1.6rem;
      font-weight: bold;
      color: #15803d;
    }
    pre {
      background: #0f172a;
      color: #38bdf8;
      padding: 18px;
      border-radius: 10px;
      overflow-x: auto;
      font-size: 0.85rem;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🦝 Telemetría en Vivo — Reduce, Recicla, Raccoon (RRR)</h1>
    <p class="subtitulo">Conteo real de partidas jugadas desde Código QR y Landing Page.</p>

    <div class="botones">
      <button class="btn-verde" onclick="consultarMetricas()">🔄 Actualizar Conteo en Vivo</button>
      <button class="btn-azul" onclick="window.location.href='/api/metrics/export'">📥 Descargar Excel (CSV)</button>
    </div>

    <div class="resumen-grid">
      <div class="stat-box">
        Total Partidas
        <span id="total-eventos">0</span>
      </div>
      <div class="stat-box">
        Entradas por QR
        <span id="total-qr">0</span>
      </div>
      <div class="stat-box">
        Entradas por Landing
        <span id="total-landing">0</span>
      </div>
    </div>

    <h3>Detalle de Registros Recibidos:</h3>
    <pre id="respuesta-servidor">Cargando métricas reales de RRR...</pre>
  </div>

  <script>
    async function consultarMetricas() {
      const visor = document.getElementById('respuesta-servidor');
      visor.textContent = 'Consultando base de datos...';

      try {
        const res = await fetch('/api/metrics');
        const json = await res.json();

        if (json.status === 'success') {
          const summary = json.data.summary;
          document.getElementById('total-eventos').textContent = summary.totalEvents || 0;
          document.getElementById('total-qr').textContent = summary.bySource.qr || 0;
          document.getElementById('total-landing').textContent = summary.bySource.landing || 0;
        }

        visor.textContent = JSON.stringify(json, null, 2);
      } catch (err) {
        visor.textContent = 'Error al conectar con la API: ' + err.message;
      }
    }

    // Carga los datos automáticamente al abrir la página
    consultarMetricas();
  </script>
</body>
</html>
